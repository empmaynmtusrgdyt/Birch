name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]          # тег v1.2.3 -> черновик релиза со всеми пакетами
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"          # LTS; для Windows и AppImage
  GRAPHVIZ_WIN_VERSION: "16.1.0"
  # Qt для пакета Windows 8.1: архив qt6windows7 той же версии, что QT_VERSION.
  # Контрольная сумма закреплена: подменённый на GitHub архив не попадёт в пакет.
  QT6WINDOWS7_SHA256: "2c825940e2a2dc83ced63a1553f9967efcfd1f71f8441e2fc30eb3a7e6473d86"

jobs:
  # ---------------------------------------------------------------------------
  macos:
    name: macOS
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - name: Уведомление о лицензии MPL 2.0 в исходных файлах
        run: .github/scripts/check-license-headers.sh
      - name: Зависимости (Homebrew)
        run: brew install qt graphviz
      - name: Сборка
        run: |
          cmake --preset macos
          cmake --build --preset macos -j
      - name: Тесты
        run: ctest --preset macos
      - name: Экспорт в Mermaid проверяется официальным mermaid-cli
        run: |
          # Тест сохраняет экспорт примеров в mermaid/*.mmd; mermaid-cli должен нарисовать каждый без ошибок
          BIRCH_MERMAID_DIR=mermaid ./build/macos/tests/tst_mermaid > /dev/null
          for f in mermaid/*.mmd; do
            echo "== $f"
            npx -y @mermaid-js/mermaid-cli@11.17.0 -i "$f" -o "${f%.mmd}.svg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mermaid
          path: mermaid/
      - name: Смоук-тест
        run: ./build/macos/Birch.app/Contents/MacOS/Birch --screenshot screenshot-macos.png resources/examples/welcome.birch
      - name: Пакет .dmg (с проверкой самодостаточности бандла)
        run: |
          # hdiutil на машинах GitHub иногда падает с «Resource busy» — повторяем
          cd build/macos
          for attempt in 1 2 3; do
            cpack && exit 0
            echo "cpack: попытка $attempt не удалась, повтор через 15 с"
            sleep 15
          done
          exit 1
      - name: Смоук-тест приложения из .dmg
        run: |
          hdiutil attach -nobrowse -readonly build/macos/Birch-*.dmg -mountpoint /tmp/birch-dmg
          /tmp/birch-dmg/Birch.app/Contents/MacOS/Birch --screenshot screenshot-macos-dmg.png resources/examples/welcome.birch
          codesign --verify --deep --strict /tmp/birch-dmg/Birch.app
      - name: Тема применяется ко всему окну
        run: |
          .github/scripts/check-theme.sh /tmp/birch-dmg/Birch.app/Contents/MacOS/Birch
          # Fusion — запасной стиль на Windows и Linux
          .github/scripts/check-theme.sh /tmp/birch-dmg/Birch.app/Contents/MacOS/Birch -style fusion
      - name: Снимок панели поиска
        run: |
          /tmp/birch-dmg/Birch.app/Contents/MacOS/Birch --find "Данные" --screenshot find-macos.png resources/examples/welcome.birch
          grep -q "^find_bar_fits=1" find-macos.png.txt || { echo "::error::Панель поиска не помещается"; exit 1; }
      - name: Командная строка
        run: .github/scripts/check-cli.sh /tmp/birch-dmg/Birch.app/Contents/MacOS/Birch
      - name: Команда birch по ссылке (как после «Установить команду birch…»)
        run: |
          mkdir -p /tmp/birch-cmd
          ln -sf /tmp/birch-dmg/Birch.app/Contents/MacOS/Birch /tmp/birch-cmd/birch
          PATH="/tmp/birch-cmd:$PATH" .github/scripts/check-cli.sh birch
          PATH="/tmp/birch-cmd:$PATH" birch --help | head -1 | grep -q '^Использование: birch ' \
            || { echo "::error::в справке не «birch»"; exit 1; }
      - name: Снимки примера с рамками
        run: |
          app=/tmp/birch-dmg/Birch.app/Contents/MacOS/Birch
          $app --screenshot-theme light --screenshot frames-light.png resources/examples/frames.birch
          $app --screenshot-theme dark --screenshot frames-dark.png resources/examples/frames.birch
          $app --screenshot-theme light --screenshot-monochrome --screenshot frames-mono.png resources/examples/frames.birch
          hdiutil detach /tmp/birch-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: |
            build/macos/Birch-*.dmg
            screenshot-macos-dmg.png
            theme-*.png
            find-*.png
            frames-*.png

  # ---------------------------------------------------------------------------
  # .deb собирается отдельно под каждый дистрибутив: имена пакетов библиотек
  # различаются (например, Graphviz в Ubuntu 26.04 — не libgvc6, как в Debian 13).
  deb:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Debian 13",    image: "debian:trixie", tag: "debian13" }
          - { name: "Ubuntu 26.04", image: "ubuntu:26.04",  tag: "ubuntu26.04" }
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Зависимости (apt)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git ca-certificates dpkg-dev file \
            qt6-base-dev qt6-svg-dev qt6-qpa-plugins libgl-dev \
            libgraphviz-dev graphviz fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: Сборка
        run: |
          cmake --preset linux
          cmake --build --preset linux -j
      - name: Тесты
        run: ctest --preset linux
      - name: Смоук-тест
        run: ./build/linux/birch --screenshot screenshot-${{ matrix.tag }}.png resources/examples/welcome.birch
      - name: Тема применяется ко всему окну
        run: .github/scripts/check-theme.sh ./build/linux/birch
      - name: Командная строка (без экрана)
        run: .github/scripts/check-cli.sh ./build/linux/birch
      - name: Пакет .deb
        run: |
          cd build/linux && cpack -G DEB
          mv birch_*_amd64.deb "$(basename birch_*_amd64.deb .deb)_${{ matrix.tag }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: package-deb-${{ matrix.tag }}
          path: |
            build/linux/*.deb
            screenshot-${{ matrix.tag }}.png

  # Пакет ставится в чистую систему того же дистрибутива: проверка зависимостей
  deb-install:
    name: Установка .deb (${{ matrix.name }})
    needs: deb
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Debian 13",    image: "debian:trixie", tag: "debian13" }
          - { name: "Ubuntu 26.04", image: "ubuntu:26.04",  tag: "ubuntu26.04" }
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-deb-${{ matrix.tag }}
      - name: apt install ./birch_*.deb
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./build/linux/birch_*.deb fonts-dejavu-core
      - name: Смоук-тест установленного пакета
        run: |
          printf '(Старт) -> {Ок?} -> [Шаг] "Да" -> (Конец)\n' > test.birch
          birch --screenshot screenshot.png test.birch
          test -f /usr/share/applications/birch.desktop
          test -f /usr/share/mime/packages/birch.xml

  # ---------------------------------------------------------------------------
  arch:
    name: Arch Linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Зависимости (pacman)
        run: pacman -Syu --noconfirm --needed base-devel git cmake qt6-base qt6-svg graphviz noto-fonts
      - uses: actions/checkout@v4
      - name: Сборка
        run: |
          cmake --preset linux
          cmake --build --preset linux -j
      - name: Тесты
        run: ctest --preset linux
      - name: Смоук-тест
        run: ./build/linux/birch --screenshot screenshot-arch.png resources/examples/welcome.birch
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-arch
          path: screenshot-arch.png
      - name: Пакет (makepkg из PKGBUILD)
        run: |
          ver=$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/pkg
          # Тот же архив, что GitHub отдаёт для тега: makepkg возьмёт его вместо скачивания
          git archive --prefix="Birch-$ver/" -o "/tmp/pkg/birch-$ver.tar.gz" HEAD
          sed "s/^pkgver=.*/pkgver=$ver/" packaging/arch/PKGBUILD > /tmp/pkg/PKGBUILD
          useradd -m builder
          chown -R builder /tmp/pkg
          su builder -c "cd /tmp/pkg && makepkg --noconfirm"
          cp /tmp/pkg/birch-*.pkg.tar.zst .
      - name: Установка пакета и смоук-тест
        run: |
          pacman -U --noconfirm ./birch-*.pkg.tar.zst
          birch --screenshot screenshot-arch-pkg.png resources/examples/welcome.birch
      - name: Тема применяется ко всему окну
        run: .github/scripts/check-theme.sh birch
      - name: Командная строка установленного пакета (без экрана)
        run: .github/scripts/check-cli.sh birch
      - uses: actions/upload-artifact@v4
        with:
          name: package-arch
          path: birch-*.pkg.tar.zst

  # ---------------------------------------------------------------------------
  appimage:
    name: AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Зависимости (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgraphviz-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfuse2 file xvfb fonts-noto-core
      - name: Сборка AppImage
        run: ./packaging/linux/build-appimage.sh
      - name: Смоук-тест AppImage (X11 через Xvfb)
        run: |
          app=$(ls build/appimage/Birch*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$app" --screenshot screenshot-appimage.png resources/examples/welcome.birch
      - name: Тема применяется ко всему окну (X11 через Xvfb)
        run: |
          app=$(ls build/appimage/Birch*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 .github/scripts/check-theme.sh xvfb-run -a "$app"
      - name: Снимок панели поиска (X11 через Xvfb)
        run: |
          app=$(ls build/appimage/Birch*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$app" --find "Данные" --screenshot find-appimage.png resources/examples/welcome.birch
          grep -q "^find_bar_fits=1" find-appimage.png.txt || { echo "::error::Панель поиска не помещается"; exit 1; }
      - name: Командная строка AppImage (без экрана)
        run: APPIMAGE_EXTRACT_AND_RUN=1 .github/scripts/check-cli.sh "$(ls build/appimage/Birch*.AppImage)"
      - name: Команда birch по ссылке на AppImage (как после «Установить команду birch…»)
        run: |
          mkdir -p /tmp/birch-cmd
          ln -sf "$PWD/$(ls build/appimage/Birch*.AppImage)" /tmp/birch-cmd/birch
          PATH="/tmp/birch-cmd:$PATH" APPIMAGE_EXTRACT_AND_RUN=1 .github/scripts/check-cli.sh birch
      - name: Снимки примера с рамками (X11 через Xvfb)
        run: |
          app=$(ls build/appimage/Birch*.AppImage)
          export APPIMAGE_EXTRACT_AND_RUN=1
          xvfb-run -a "$app" --screenshot-theme light --screenshot frames-light.png resources/examples/frames.birch
          xvfb-run -a "$app" --screenshot-theme dark --screenshot frames-dark.png resources/examples/frames.birch
          xvfb-run -a "$app" --screenshot-theme light --screenshot-monochrome --screenshot frames-mono.png resources/examples/frames.birch
      - uses: actions/upload-artifact@v4
        with:
          name: package-appimage
          path: |
            build/appimage/Birch*.AppImage
            screenshot-appimage.png
            theme-*.png
            find-*.png
            frames-*.png

  # ---------------------------------------------------------------------------
  # Server 2022 — основа Windows 10: стиль windowsvista, Birch заменяет его на Fusion
  windows:
    name: Windows
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Graphviz (официальная сборка MSVC)
        shell: pwsh
        run: |
          $v = $env:GRAPHVIZ_WIN_VERSION
          $url = "https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/$v/windows_10_cmake_Release_Graphviz-$v-win64.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\graphviz.zip"
          Expand-Archive "$env:RUNNER_TEMP\graphviz.zip" -DestinationPath "$env:RUNNER_TEMP"
          $root = "$env:RUNNER_TEMP\Graphviz-$v-win64"
          "GRAPHVIZ_ROOT=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
      - name: Сборка
        run: |
          cmake --preset windows -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build --preset windows
      - name: Тесты
        run: ctest --preset windows
      - name: Подробности упавших тестов
        if: failure()
        shell: pwsh
        run: |
          # ctest на Windows иногда не показывает вывод упавшего теста — запускаем напрямую
          Get-ChildItem build\windows\Release\tst_*.exe | ForEach-Object {
            & $_.FullName -o "$($_.BaseName).txt,txt"
            "== $($_.Name): код $LASTEXITCODE"
            if (Test-Path "$($_.BaseName).txt") { Get-Content "$($_.BaseName).txt" | Select-String -NotMatch "^PASS" }
          }
      - name: Смоук-тест
        shell: pwsh
        run: |
          # Birch.exe — GUI-приложение: ждём его завершения явно
          $p = Start-Process build\windows\Release\Birch.exe -Wait -PassThru `
                 -ArgumentList "--screenshot", "screenshot-windows.png", "resources\examples\welcome.birch"
          if ($p.ExitCode -ne 0) { throw "Birch.exe завершился с кодом $($p.ExitCode)" }
          if (-not (Test-Path screenshot-windows.png)) { throw "нет снимка" }
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows
          path: screenshot-windows.png
      - name: Пакеты .zip и установщик NSIS
        run: |
          cd build\windows
          cpack -C Release
      - name: Тихая установка и смоук-тест с чистым PATH
        shell: pwsh
        run: |
          $installer = Get-ChildItem build\windows\Birch-*-windows-x64.exe | Select-Object -First 1
          $p = Start-Process $installer.FullName -ArgumentList "/S", "/D=C:\BirchTest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "установщик завершился с кодом $($p.ExitCode)" }
          if (-not (Test-Path "Registry::HKEY_CLASSES_ROOT\.birch")) { throw "нет связи с файлами .birch" }
          foreach ($f in "LICENSE.txt", "THIRD-PARTY-NOTICES.txt", "licenses\LGPL-3.0.txt", "licenses\EPL-2.0.txt") {
            if (-not (Test-Path "C:\BirchTest\$f")) { throw "в пакете нет $f" }
          }
          if (Select-String -Path C:\BirchTest\LICENSE.txt -Pattern "Mozilla Public License Version 2.0" -Quiet) { "Лицензия: MPL 2.0" }
          else { throw "LICENSE.txt — не MPL 2.0" }

          # Без Qt и Graphviz из окружения сборки: все DLL должны быть в пакете.
          # Настоящая платформа windows, а не offscreen — её windeployqt и кладёт.
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:QT_QPA_PLATFORM
          $shot = Join-Path $PWD "screenshot-windows-installed.png"
          $p = Start-Process C:\BirchTest\bin\Birch.exe -Wait -PassThru `
                 -ArgumentList "--screenshot", "`"$shot`"", "`"$PWD\resources\examples\welcome.birch`""
          if ($p.ExitCode -ne 0) { throw "установленный Birch.exe завершился с кодом $($p.ExitCode)" }
          if (-not (Test-Path $shot)) { throw "нет снимка" }
          Get-ChildItem C:\BirchTest\bin -Filter *.dll | Measure-Object -Property Length -Sum |
            ForEach-Object { "DLL: $($_.Count) шт., $([math]::Round($_.Sum / 1MB, 1)) МБ" }
      - name: Тема применяется ко всему окну
        shell: pwsh
        run: |
          # Установленный Birch с настоящей платформой windows и родным стилем
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          .github\scripts\check-theme.ps1 C:\BirchTest\bin\Birch.exe
      - name: Снимок панели поиска
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $shot = Join-Path $PWD "find-windows.png"
          $p = Start-Process C:\BirchTest\bin\Birch.exe -Wait -PassThru `
                 -ArgumentList "--find", "Данные", "--screenshot", "`"$shot`"", "`"$PWD\resources\examples\welcome.birch`""
          if ($p.ExitCode -ne 0) { throw "Birch.exe --find завершился с кодом $($p.ExitCode)" }
          if (-not (Select-String -Path "$shot.txt" -Pattern "^find_bar_fits=1" -Quiet)) { throw "Панель поиска не помещается" }
      - name: Командная строка
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          .github\scripts\check-cli.ps1 C:\BirchTest\bin\Birch.exe
      - name: Команда birch в консоли (birch.com и PATH)
        shell: pwsh
        run: .github\scripts\check-console.ps1 C:\BirchTest
      - name: Кириллица в окне консоли
        shell: pwsh
        timeout-minutes: 5
        run: .github\scripts\check-console-text.ps1 C:\BirchTest
      - name: Снимки примера с рамками
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          function Shot([string] $name, [string[]] $options) {
            $shot = Join-Path $PWD $name
            $argList = $options + @("--screenshot", "`"$shot`"", "`"$PWD\resources\examples\frames.birch`"")
            $p = Start-Process C:\BirchTest\bin\Birch.exe -Wait -PassThru -ArgumentList $argList
            if ($p.ExitCode -ne 0) { throw "Birch.exe ($name) завершился с кодом $($p.ExitCode)" }
          }
          Shot "frames-light.png" @("--screenshot-theme", "light")
          Shot "frames-dark.png" @("--screenshot-theme", "dark")
          Shot "frames-mono.png" @("--screenshot-theme", "light", "--screenshot-monochrome")
      - uses: actions/upload-artifact@v4
        with:
          name: theme-windows
          path: |
            theme-*.png
            find-*.png
            frames-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            build/windows/Birch-*-windows-x64.exe
            build/windows/Birch-*-windows-x64.zip
            screenshot-windows-installed.png

  # Server 2025 — основа Windows 11: стиль windows11. Ставим тот же установщик,
  # что собран на Server 2022 (Visual Studio 2022 здесь нет).
  windows-11:
    name: Установка на Windows 11 (Server 2025)
    needs: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-windows
          path: package
      - name: Тихая установка
        shell: pwsh
        run: |
          $installer = Get-ChildItem package -Recurse -Filter Birch-*-windows-x64.exe | Select-Object -First 1
          $p = Start-Process $installer.FullName -ArgumentList "/S", "/D=C:\BirchTest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "установщик завершился с кодом $($p.ExitCode)" }
      - name: Тема применяется ко всему окну
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          .github\scripts\check-theme.ps1 C:\BirchTest\bin\Birch.exe
      - name: Снимок панели поиска
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $shot = Join-Path $PWD "find-windows.png"
          $p = Start-Process C:\BirchTest\bin\Birch.exe -Wait -PassThru `
                 -ArgumentList "--find", "Данные", "--screenshot", "`"$shot`"", "`"$PWD\resources\examples\welcome.birch`""
          if ($p.ExitCode -ne 0) { throw "Birch.exe --find завершился с кодом $($p.ExitCode)" }
          if (-not (Select-String -Path "$shot.txt" -Pattern "^find_bar_fits=1" -Quiet)) { throw "Панель поиска не помещается" }
      - name: Командная строка
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          .github\scripts\check-cli.ps1 C:\BirchTest\bin\Birch.exe
      - name: Команда birch в консоли (birch.com и PATH)
        shell: pwsh
        run: .github\scripts\check-console.ps1 C:\BirchTest
      - name: Кириллица в окне консоли
        shell: pwsh
        timeout-minutes: 5
        run: .github\scripts\check-console-text.ps1 C:\BirchTest
      - name: Снимки примера с рамками
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          function Shot([string] $name, [string[]] $options) {
            $shot = Join-Path $PWD $name
            $argList = $options + @("--screenshot", "`"$shot`"", "`"$PWD\resources\examples\frames.birch`"")
            $p = Start-Process C:\BirchTest\bin\Birch.exe -Wait -PassThru -ArgumentList $argList
            if ($p.ExitCode -ne 0) { throw "Birch.exe ($name) завершился с кодом $($p.ExitCode)" }
          }
          Shot "frames-light.png" @("--screenshot-theme", "light")
          Shot "frames-dark.png" @("--screenshot-theme", "dark")
          Shot "frames-mono.png" @("--screenshot-theme", "light", "--screenshot-monochrome")
      - name: Удаление убирает birch из PATH
        shell: pwsh
        run: |
          # _?= — удалять на месте и дождаться (иначе деинсталлятор копирует себя во временную папку)
          $p = Start-Process C:\BirchTest\Uninstall.exe -ArgumentList "/S", "_?=C:\BirchTest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "деинсталлятор завершился с кодом $($p.ExitCode)" }
          $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if (($path -split ";") -contains "C:\BirchTest\cmd") { throw "после удаления C:\BirchTest\cmd осталась в PATH" }
          if (Test-Path "C:\BirchTest\bin\Birch.exe") { throw "Birch.exe не удалён" }
          "PATH после удаления чист"
      - uses: actions/upload-artifact@v4
        with:
          name: theme-windows-11
          path: |
            theme-*.png
            find-*.png
            frames-*.png

  # ---------------------------------------------------------------------------
  # Тег v* -> черновик релиза. Публикуется вручную после проверки описания.
  # Windows 8.1: та же сборка, но библиотеки Qt заменены версиями с исправлениями
  # qt6windows7 (Qt 6 официально работает только на Windows 10+). Машин с Windows 8.1
  # в GitHub нет: здесь проверяются таблицы импорта пакета и работа на Windows 10.
  windows8:
    name: Windows 8.1 (пакет)
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Graphviz (официальная сборка MSVC)
        shell: pwsh
        run: |
          $v = $env:GRAPHVIZ_WIN_VERSION
          $url = "https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/$v/windows_10_cmake_Release_Graphviz-$v-win64.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\graphviz.zip"
          Expand-Archive "$env:RUNNER_TEMP\graphviz.zip" -DestinationPath "$env:RUNNER_TEMP"
          $root = "$env:RUNNER_TEMP\Graphviz-$v-win64"
          "GRAPHVIZ_ROOT=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
      - name: Qt для Windows 8.1 (qt6windows7)
        shell: pwsh
        run: |
          $url = "https://github.com/crystalidea/qt6windows7/releases/download/v$env:QT_VERSION/qt6_x64_to_run_on_windows7.7z"
          $archive = "$env:RUNNER_TEMP\qt6windows7.7z"
          Invoke-WebRequest $url -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($hash -ne $env:QT6WINDOWS7_SHA256) { throw "контрольная сумма архива qt6windows7 не совпадает: $hash" }
          7z x $archive -o"$env:RUNNER_TEMP\qt6windows7" -y | Out-Null
          "QT6WINDOWS7_DIR=$env:RUNNER_TEMP\qt6windows7" >> $env:GITHUB_ENV
      - name: Сборка и пакеты
        run: |
          cmake --preset windows -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBIRCH_BUILD_TESTS=OFF `
                -DBIRCH_QT_WINDOWS8_DIR="$env:QT6WINDOWS7_DIR"
          cmake --build --preset windows
          cd build\windows
          cpack -C Release
      - name: Пакет не требует ничего новее Windows 8.1
        shell: pwsh
        run: |
          $zip = Get-ChildItem build\windows\Birch-*-windows8-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\pkg8"
          $root = (Get-ChildItem "$env:RUNNER_TEMP\pkg8" -Directory | Select-Object -First 1).FullName
          python .github\scripts\check-win81.py $root --qt-version $env:QT_VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "PKG8=$root" >> $env:GITHUB_ENV
      - name: Запуск в разных режимах (при зависании — стеки потоков)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          # Плагины официального Qt из install-qt-action не должны попасть в программу с Qt для Windows 8.1
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          .github\scripts\diagnose-hang.ps1 "$env:PKG8\bin\Birch.exe"
      - name: Тихая установка и смоук-тест на Windows 10
        shell: pwsh
        timeout-minutes: 10
        run: |
          $installer = Get-ChildItem build\windows\Birch-*-windows8-x64.exe | Select-Object -First 1
          $p = Start-Process $installer.FullName -ArgumentList "/S", "/D=C:\BirchTest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "установщик завершился с кодом $($p.ExitCode)" }
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          # Плагины официального Qt из install-qt-action не должны попасть в программу с Qt для Windows 8.1
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM
          $shot = Join-Path $PWD "screenshot-windows8-package.png"
          $p = Start-Process C:\BirchTest\bin\Birch.exe -Wait -PassThru `
                 -ArgumentList "--screenshot", "`"$shot`"", "`"$PWD\resources\examples\welcome.birch`""
          if ($p.ExitCode -ne 0) { throw "Birch.exe завершился с кодом $($p.ExitCode)" }
          if (-not (Test-Path $shot)) { throw "нет снимка" }
      - name: Тема применяется ко всему окну
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          # Плагины официального Qt из install-qt-action не должны попасть в программу с Qt для Windows 8.1
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          .github\scripts\check-theme.ps1 C:\BirchTest\bin\Birch.exe
      - name: Командная строка и команда birch в консоли
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          # Плагины официального Qt из install-qt-action не должны попасть в программу с Qt для Windows 8.1
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          .github\scripts\check-console.ps1 C:\BirchTest
      - name: Кириллица в окне консоли
        shell: pwsh
        timeout-minutes: 5
        run: |
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          .github\scripts\check-console-text.ps1 C:\BirchTest
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows8
          path: |
            build/windows/Birch-*-windows8-x64.exe
            build/windows/Birch-*-windows8-x64.zip
            screenshot-windows8-package.png

  release:
    name: Черновик релиза
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, deb-install, arch, appimage, windows, windows-11, windows8]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
      - name: Собрать файлы релиза
        run: |
          mkdir release
          find artifacts -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.pkg.tar.zst' \
               -o -name '*.AppImage' -o -name 'Birch-*-windows-x64.exe' -o -name 'Birch-*-windows-x64.zip' \
               -o -name 'Birch-*-windows8-x64.exe' -o -name 'Birch-*-windows8-x64.zip' \) \
               -exec cp {} release/ \;
          ls -la release
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Создать черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "Birch ${GITHUB_REF_NAME#v}" \
            --notes "Черновик: описание будет добавлено перед публикацией."
